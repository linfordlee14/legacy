# CI pipeline. Spec: deployment/CI_CD.md sections 4.2 and 4.3 (MVP-002).
#
# Implemented gates (all blocking, CI-29):
#   spec-checks          CI_CD 4.2 stages 1-6 (stage 7, tier discipline, is
#                        reviewer judgment carried by the PR checklist)
#   master-context-guard CI-04 immutability of knowledge/MASTER_CONTEXT.md
#   api / web            CI_CD 4.3 stages 1-3 (lint, types, unit tests),
#                        stage 5 SAST, stage 6 dependency audit
#   secret-scan          CI_CD 4.3 stage 7
#   docker-image / web build  CI_CD 4.3 stage 8 artifacts
#
# Stage 4 (integration tests) joins with the database at MVP-003.
# Stages 9-11 (staging deploy, AI evaluation gate, production) join when
# staging exists (vendor ADR and owner provisioning) and the ask path ships.
name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spec conventions (CI_CD 4.2 stages 1-6)
        run: python3 scripts/check_specs.py

  master-context-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'master-context-approved') }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MASTER_CONTEXT immutability (CI-04)
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qx 'knowledge/MASTER_CONTEXT.md'; then
            if [ "$APPROVED" != "true" ]; then
              echo "knowledge/MASTER_CONTEXT.md is immutable (CI-04)."
              echo "Owner-approved consolidation passes require the 'master-context-approved' label."
              exit 1
            fi
            echo "MASTER_CONTEXT change permitted: owner-approved consolidation label present."
          else
            echo "MASTER_CONTEXT untouched."
          fi

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (stage 1)
        run: ruff check .
      - name: Type check (stage 2)
        run: mypy
      - name: Unit tests (stage 3)
        run: python -m pytest
        env:
          LEGACY_ENV: local
      - name: SAST, high severity blocking (stage 5)
        run: bandit -r src --severity-level high
      - name: Dependency audit (stage 6)
        run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (stage 1)
        run: npm run lint
      - name: Type check (stage 2)
        run: npm run typecheck
      - name: Unit tests (stage 3)
        run: npm test
      - name: Dependency audit (stage 6)
        run: npm audit --audit-level=high
      - name: Build artifact (stage 8)
        run: npm run build
        env:
          NEXT_PUBLIC_LEGACY_ENV: local

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (stage 7)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (stage 8, DEP-24)
        run: docker build -t "legacy-api:${GITHUB_SHA}" services/api

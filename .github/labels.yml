# Label definitions for the Legacy repository.
# Apply with: npx github-label-sync --access-token <token> --labels .github/labels.yml <owner>/legacy
# Taxonomy is defined in roadmap/GITHUB_MILESTONES.md section 4.10 and mirrors
# the domain codes in docs/SPEC_CONVENTIONS.md section 4.

# Type (exactly one per issue)
- name: "type: feature"
  color: "1d76db"
  description: "New capability specified in specs/ or roadmap/"
- name: "type: bug"
  color: "d73a4a"
  description: "Behavior deviates from a specification"
- name: "type: spec"
  color: "0075ca"
  description: "Specification change (spec-first rule applies)"
- name: "type: docs"
  color: "006b75"
  description: "Documentation that is not a normative spec change"
- name: "type: infra"
  color: "5319e7"
  description: "Environments, CI/CD, deployment, tooling"
- name: "type: security"
  color: "b60205"
  description: "Security-relevant work or finding"
- name: "type: drill"
  color: "fbca04"
  description: "Restore, vault, steward, or disaster drills"
- name: "type: eval"
  color: "0e8a16"
  description: "AI evaluation suites: groundedness, citations, tier discipline"

# Priority (mirrors IMPLEMENTATION_TASKS)
- name: "priority: P0"
  color: "b60205"
  description: "Blocking for the current milestone"
- name: "priority: P1"
  color: "d93f0b"
  description: "Should ship in the current milestone"
- name: "priority: P2"
  color: "fbca04"
  description: "Stretch; ships only if the window allows"

# Domain (mirrors SPEC_CONVENTIONS section 4 domain codes)
- name: "domain: ingestion"
  color: "c5def5"
  description: "Capture and ingestion (FR-ING)"
- name: "domain: graph"
  color: "c5def5"
  description: "Knowledge graph (FR-KG)"
- name: "domain: timeline"
  color: "c5def5"
  description: "Timeline engine (FR-TL)"
- name: "domain: search"
  color: "c5def5"
  description: "Search (FR-SRCH)"
- name: "domain: rag"
  color: "c5def5"
  description: "Retrieval and RAG pipeline (FR-RAG)"
- name: "domain: memory"
  color: "c5def5"
  description: "Memory system (FR-MEM)"
- name: "domain: twin"
  color: "c5def5"
  description: "Digital twin (FR-TWIN)"
- name: "domain: agents"
  color: "c5def5"
  description: "Agents and orchestration (FR-AGT)"
- name: "domain: verification"
  color: "c5def5"
  description: "Verification, provenance, citations (FR-VER)"
- name: "domain: api"
  color: "c5def5"
  description: "Public and internal APIs (FR-API)"
- name: "domain: ui"
  color: "c5def5"
  description: "User interface (FR-UI)"
- name: "domain: data"
  color: "c5def5"
  description: "Database and storage (FR-DATA)"
- name: "domain: privacy"
  color: "c5def5"
  description: "Privacy and data governance (FR-PRIV)"
- name: "domain: security"
  color: "c5def5"
  description: "Security domain work (FR-SEC)"
- name: "domain: ops"
  color: "c5def5"
  description: "Deployment, observability, backup (FR-OPS)"

# Invariants (extra review required)
- name: "invariant: privacy-tiers"
  color: "b60205"
  description: "Touches P0-P3 tier enforcement; leak tests mandatory"
- name: "invariant: provenance"
  color: "e99695"
  description: "Touches Claims, Sources, or confidence tiers; never-upgrade rule applies"

# Workflow
- name: "status: blocked"
  color: "000000"
  description: "Cannot proceed; blocker named in the issue"
- name: "needs: owner-decision"
  color: "d4c5f9"
  description: "Waiting on a decision only the owner can make"
- name: "needs: legal-review"
  color: "d4c5f9"
  description: "Waiting on professional legal input (e.g. succession, POPIA)"
- name: "gate"
  color: "f9d0c4"
  description: "Roadmap decision gate review (G1 to G5)"
- name: "descope-ladder"
  color: "fef2c0"
  description: "Invoked or affected by the MVP descope ladder (MVP_PLAN section 7)"
- name: "good first issue"
  color: "7057ff"
  description: "Well-scoped, spec-anchored, low-context task"
- name: "help wanted"
  color: "008672"
  description: "Contributor help welcome on this item"

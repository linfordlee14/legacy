# Local environment (DEP-01, DEP-04): the API service as a container, using
# the versioned non-secret configuration from infra/environments/local.env.
# The web client runs natively during development: make dev-web.
services:
  api:
    build: services/api
    env_file: infra/environments/local.env
    ports:
      - "8000:8000"

  # Local database (DEP-04): Postgres with pgvector, mirroring the managed
  # Supabase topology. The password below is a local-only convention, not a
  # secret; staging and production URLs live in platform secret managers
  # (DEP-18, DEP-19).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
      POSTGRES_DB: legacy_local
    ports:
      - "5432:5432"
    volumes:
      - legacy-pgdata:/var/lib/postgresql/data

volumes:
  legacy-pgdata:
